services:
  postgres:
    image: postgres:16-alpine
    container_name: medinv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-medical_inventory}
      POSTGRES_USER: ${DB_USER:-medinv}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/src/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    # Uncomment to allow direct DB access from host (debugging only):
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medinv} -d ${DB_NAME:-medical_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medinv_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medical_inventory}
      DB_USER: ${DB_USER:-medinv}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_minimum_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_min_32}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      # CORS_ORIGIN=* allows any LAN device through the nginx proxy.
      # Set to http://192.168.x.x:3000 for a fixed clinic server.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      # Email (SMTP) — leave SMTP_HOST blank to disable all email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@clinic.local}
      # Scheduled job timezone (IANA tz string, e.g. Australia/Sydney)
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-UTC}
      # File uploads volume mount point
      UPLOAD_DIR: /uploads
      # Backup directory for the weekly integrity check
      BACKUP_DIR: ${BACKUP_DIR:-/opt/medinv/backups}
    volumes:
      - ./version.json:/app/version.json:ro
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Uncomment for direct backend access when debugging:
    # ports:
    #   - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = use relative URLs (/api/...) — nginx proxies internally.
        VITE_API_URL: ""
    container_name: medinv_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
